[package]
name = "pixidl-native-host"
description = "Native-messaging host that connects browser extensions to pixidl"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
pixidl-core = { path = "../pixidl-core" }
tokio = { version = "1", features = ["rt", "net", "time", "macros", "io-util"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
