[package]
name = "nexa-native-host"
description = "Native-messaging host that connects browser extensions to Nexa Download Manager"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nexa-core = { path = "../nexa-core" }
tokio = { version = "1", features = ["rt", "net", "time", "macros", "io-util"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
