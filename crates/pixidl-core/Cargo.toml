[package]
name = "pixidl-core"
description = "Download manager core: engines, queue, persistence and browser protocol"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "stream", "socks", "http2", "charset"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rusqlite_migration = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
percent-encoding = "2"
fs4 = { version = "0.13", features = ["sync"] }
librqbit = { version = "9", default-features = false, features = ["rust-tls"] }
ts-rs = { version = "10", features = ["serde-compat", "chrono-impl"] }
parking_lot = "0.12"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
bytes = "1"
directories = "5"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
semver = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
tempfile = "3"
axum = "0.7"
futures = "0.3"
tower-http = { version = "0.6", features = ["fs"] }
tokio = { version = "1", features = ["full", "test-util"] }
