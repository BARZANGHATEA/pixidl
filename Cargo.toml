[workspace]
resolver = "2"
members = ["crates/nexa-core", "crates/nexa-native-host", "src-tauri"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
authors = ["Nexa Download Manager contributors"]
rust-version = "1.80"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
