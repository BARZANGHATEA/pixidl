[workspace]
resolver = "2"
members = ["crates/pixidl-core", "crates/pixidl-native-host", "src-tauri"]

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "MIT"
authors = ["pixidl contributors"]
rust-version = "1.80"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

# Patched copy of librqbit-tracker-comms (Apache-2.0): falls back to IPv4 for
# the UDP tracker socket on systems without IPv6. See third_party/README.md.
[patch.crates-io]
librqbit-tracker-comms = { path = "third_party/librqbit-tracker-comms" }

# Keep debug builds small: full debug info for our crates only.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
