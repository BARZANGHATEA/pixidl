<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pixidl</title>
    <link rel="stylesheet" href="ui.css" />
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <header class="head">
      <svg class="logo" width="30" height="30" viewBox="64 64 896 896" aria-hidden="true" focusable="false"><defs><linearGradient id="pxg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#4F46E5"/></linearGradient></defs><rect x="64" y="64" width="896" height="896" rx="216" fill="url(#pxg)"/><g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round"><path d="M410 268 H575 A140 140 0 0 1 575 548 H410" stroke-width="104"/><path d="M410 268 V738" stroke-width="104"/><path d="M300 640 L410 750 L520 640" stroke-width="96"/></g></svg>
      <div class="head-text">
        <div class="brand">pixidl</div>
        <div id="conn" class="conn" data-state="checking">
          <span class="dot" aria-hidden="true"></span>
          <span id="conn-text" data-i18n="statusChecking"></span>
        </div>
      </div>
    </header>
    <p id="conn-hint" class="conn-hint small" hidden></p>

    <section class="card capture">
      <label class="toggle">
        <span class="toggle-text"><span class="toggle-title" data-i18n="popupCaptureLabel"></span><span class="muted small" data-i18n="popupCaptureHint"></span></span>
        <input id="capture" class="switch" type="checkbox" role="switch" />
      </label>
      <label id="site-row" class="toggle site" hidden>
        <span class="toggle-text"><span id="site-label" class="toggle-title"></span></span>
        <input id="capture-site" class="switch" type="checkbox" role="switch" />
      </label>
    </section>

    <section class="card detect">
      <div class="detect-text">
        <div id="detected-count" class="detect-title"></div>
        <div id="detected-hint" class="muted small" data-i18n="detectedHint"></div>
      </div>
      <button id="review" class="primary" type="button" data-i18n="reviewAndSend" disabled></button>
    </section>

    <div class="actions">
      <button id="all-links" type="button" data-i18n="allLinksButton"></button>
      <button id="send-page" type="button" data-i18n="sendPageButton"></button>
    </div>

    <p id="message" class="message" role="status" hidden></p>

    <section class="downloads-section">
      <h2 data-i18n="activeDownloads"></h2>
      <ul id="downloads" class="downloads"></ul>
      <p id="no-downloads" class="muted small" data-i18n="noActiveDownloads"></p>
    </section>

    <footer class="foot">
      <button id="open-settings" class="link" type="button" data-i18n="settingsLink"></button>
    </footer>
  </body>
</html>
