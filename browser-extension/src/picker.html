<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pixidl</title>
    <link rel="stylesheet" href="ui.css" />
    <link rel="stylesheet" href="picker.css" />
    <script type="module" src="picker.js"></script>
  </head>
  <body>
    <div class="app">
      <header class="head">
        <svg class="logo" width="30" height="30" viewBox="64 64 896 896" aria-hidden="true" focusable="false"><defs><linearGradient id="pxg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#4F46E5"/></linearGradient></defs><rect x="64" y="64" width="896" height="896" rx="216" fill="url(#pxg)"/><g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round"><path d="M410 268 H575 A140 140 0 0 1 575 548 H410" stroke-width="104"/><path d="M410 268 V738" stroke-width="104"/><path d="M300 640 L410 750 L520 640" stroke-width="96"/></g></svg>
        <div class="head-text">
          <h1 id="title"></h1>
          <div id="source" class="muted source" dir="ltr"></div>
        </div>
      </header>

      <div class="toolbar">
        <label class="search">
          <span id="search-icon" class="search-icon"></span>
          <input id="search" type="search" autocomplete="off" spellcheck="false" data-i18n-placeholder="searchPlaceholder" data-i18n-aria="searchPlaceholder" />
        </label>
        <div class="toolbar-row">
          <div id="chips" class="chips" role="group" data-i18n-aria="filterByType"></div>
          <div class="select-buttons">
            <button id="select-all" class="link" type="button" data-i18n="selectAll"></button>
            <button id="select-none" class="link" type="button" data-i18n="selectNone"></button>
          </div>
        </div>
      </div>

      <div id="banner" class="banner" role="alert" hidden></div>

      <ul id="list" class="list" role="listbox" aria-multiselectable="true" data-i18n-aria="linkList"></ul>
      <p id="empty" class="empty muted" hidden></p>

      <footer class="foot">
        <div class="foot-text">
          <div id="summary" class="summary"></div>
          <div id="status" class="status" role="status" aria-live="polite"></div>
        </div>
        <div class="foot-buttons">
          <button id="cancel" type="button" data-i18n="cancel"></button>
          <button id="send" class="primary" type="button" data-i18n="sendToApp" disabled></button>
        </div>
      </footer>
    </div>
  </body>
</html>
