<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pixidl</title>
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <header class="head">
      <img src="icons/icon-32.png" width="28" height="28" alt="" />
      <div class="head-text">
        <div class="title" data-i18n="extName"></div>
        <div id="conn" class="conn" data-state="checking">
          <span class="dot" aria-hidden="true"></span>
          <span id="conn-text" data-i18n="statusChecking"></span>
        </div>
      </div>
    </header>

    <section class="actions">
      <button id="send-page" class="primary" type="button" data-i18n="sendPage"></button>
      <button id="collect" type="button" data-i18n="collectLinks"></button>
    </section>

    <section id="links" class="card" hidden>
      <div id="links-count" class="count"></div>
      <label for="filter" data-i18n="filterLabel"></label>
      <input id="filter" type="text" dir="ltr" spellcheck="false" autocomplete="off" data-i18n-placeholder="filterPlaceholder" />
      <button id="send-links" class="primary" type="button"></button>
    </section>

    <p id="message" class="message" role="status" hidden></p>

    <section>
      <h2 data-i18n="activeDownloads"></h2>
      <ul id="downloads" class="downloads"></ul>
      <p id="no-downloads" class="muted" data-i18n="noActiveDownloads"></p>
    </section>

    <details class="settings">
      <summary data-i18n="settingsTitle"></summary>
      <label class="check">
        <input id="capture" type="checkbox" />
        <span data-i18n="captureLabel"></span>
      </label>
      <p class="muted" data-i18n="captureHint"></p>
      <label for="min-size" data-i18n="minSizeLabel"></label>
      <input id="min-size" type="number" min="0" max="1000000" step="1" inputmode="numeric" />
    </details>
  </body>
</html>
