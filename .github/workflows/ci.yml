name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test-linux:
    name: Tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config ffmpeg
          pipx install yt-dlp
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Typecheck and frontend tests
        run: |
          npm run typecheck
          npm test
      - name: Browser extension tests
        run: node --test browser-extension/test/
      - name: Frontend build
        run: npm run build:web
      - name: Native host sidecar
        run: node scripts/build-native-host.mjs --debug
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests (unit + integration)
        run: cargo test --workspace

  windows:
    name: Windows build, tests and installer
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Frontend tests
        run: npm test
      - name: Native host sidecar (debug, for tests)
        run: node scripts/build-native-host.mjs --debug
      - name: Rust tests on Windows
        run: cargo test --workspace
      - name: Build installer (bundles checksum-verified yt-dlp)
        run: npm run package:windows
      - name: Locate installer
        id: installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $exe) { throw "NSIS installer not found" }
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "Installer: $($exe.FullName) ($([math]::Round($exe.Length / 1MB, 1)) MB)"
      - name: Install silently and verify
        shell: pwsh
        run: |
          $installer = "${{ steps.installer.outputs.path }}"
          Start-Process -FilePath $installer -ArgumentList "/S" -Wait
          $dir = Join-Path $env:LOCALAPPDATA "pixidl"
          foreach ($f in @("pixidl.exe", "pixidl-native-host.exe", "bin\yt-dlp.exe", "THIRD-PARTY-NOTICES.md", "uninstall.exe")) {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "missing after install: $f" }
          }
          & (Join-Path $dir "pixidl-native-host.exe") --version
          $status = & (Join-Path $dir "pixidl-native-host.exe") --status | ConvertFrom-Json
          $status | Format-Table browser, registered, manifestPath
          foreach ($key in @("HKCU:\Software\Google\Chrome\NativeMessagingHosts\com.pixidl.app",
                             "HKCU:\Software\Microsoft\Edge\NativeMessagingHosts\com.pixidl.app",
                             "HKCU:\Software\Mozilla\NativeMessagingHosts\com.pixidl.app")) {
            if (-not (Test-Path $key)) { throw "native messaging key missing: $key" }
            $manifest = (Get-ItemProperty $key)."(default)"
            if (-not (Test-Path $manifest)) { throw "manifest missing: $manifest" }
          }
          if (($status | Where-Object { -not $_.registered }).Count -gt 0) { throw "some browsers not registered" }
      - name: Launch app and talk to it through the native host
        shell: pwsh
        run: |
          $dir = Join-Path $env:LOCALAPPDATA "pixidl"
          # Speak Chrome's native-messaging framing to the installed host; it starts the app.
          $py = @'
          import json, struct, subprocess, sys, time
          host = sys.argv[1]
          p = subprocess.Popen([host, "chrome-extension://ndlafmjbcbcjmkegfelbhgknmajgdbna/"], stdin=subprocess.PIPE, stdout=subprocess.PIPE)
          def send(m):
              b = json.dumps(m).encode()
              p.stdin.write(struct.pack("=I", len(b)) + b); p.stdin.flush()
              n = struct.unpack("=I", p.stdout.read(4))[0]
              return json.loads(p.stdout.read(n))
          r = send({"version": 1, "type": "ping", "id": "1"})
          print(r); assert r["success"], r
          r = send({"version": 1, "type": "add_download", "payload": {"url": "https://raw.githubusercontent.com/github/gitignore/main/Rust.gitignore"}})
          print(r); assert r["success"], r
          did = r["download_id"]
          for _ in range(60):
              s = send({"version": 1, "type": "get_status", "payload": {"download_id": did}})
              if s["download"]["status"] in ("completed", "failed"): break
              time.sleep(1)
          print(s); assert s["download"]["status"] == "completed", s
          '@
          $py | Out-File -Encoding utf8 nm_test.py
          python nm_test.py (Join-Path $dir "pixidl-native-host.exe")
          $file = Join-Path ([Environment]::GetFolderPath("UserProfile")) "Downloads\Rust.gitignore"
          if (-not (Test-Path $file)) { throw "downloaded file not found: $file" }
          Get-Process pixidl -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: Uninstall silently and verify cleanup
        shell: pwsh
        run: |
          $dir = Join-Path $env:LOCALAPPDATA "pixidl"
          Start-Process -FilePath (Join-Path $dir "uninstall.exe") -ArgumentList "/S" -Wait
          Start-Sleep -Seconds 5
          if (Test-Path (Join-Path $dir "pixidl.exe")) { throw "app still installed" }
          foreach ($key in @("HKCU:\Software\Google\Chrome\NativeMessagingHosts\com.pixidl.app",
                             "HKCU:\Software\Mozilla\NativeMessagingHosts\com.pixidl.app")) {
            if (Test-Path $key) { throw "native messaging key left behind: $key" }
          }
          Write-Host "Uninstall removed the app and the browser integration."
      - uses: actions/upload-artifact@v4
        with:
          name: pixidl-windows-installer
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
